<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Productos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

<div class="contenedor">

    <h1>🔐 Inicio de Sesión</h1>

    <form action="/login" method="POST">

               name="usuario"
               placeholder="Ingrese usuario">

               name="password"

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
